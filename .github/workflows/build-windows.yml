name: build-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist:windows --workspace reika-desktop-client
      - uses: actions/upload-artifact@v4
        with:
          name: Reika-Windows-${{ github.sha }}
          path: client/release/*.exe
          if-no-files-found: error
          retention-days: 14
